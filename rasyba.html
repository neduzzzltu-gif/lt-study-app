<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rašybos treniruoklis</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --ok:#1f8a4c; --bad:#c62828; --accent:#2b4cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; }
  .mode { font-size:14px; color:var(--accent); text-decoration:none; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .sentence { font-size:19px; line-height:2.3; }
  .sentence input { font:inherit; font-size:18px; text-align:center; border:none; border-bottom:2px solid var(--accent); background:#eef1ff; border-radius:6px 6px 0 0; padding:0 2px; margin:0 1px; outline:none; }
  .sentence input:focus { background:#dfe5ff; }
  .sentence input.ok { border-color:var(--ok); background:#e6f5ec; color:var(--ok); }
  .sentence input.bad { border-color:var(--bad); background:#fdecec; color:var(--bad); text-decoration:line-through; }
  .hint { color:var(--muted); font-size:15px; }
  .actions { display:flex; gap:10px; margin-top:20px; }
  .actions button { font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; }
  .primary { background:var(--ink); color:#fff; }
  .secondary { background:var(--line); color:var(--ink); }
  .result { margin-top:20px; }
  .score { font-weight:600; margin-bottom:12px; }
  .mistake { border-left:4px solid var(--bad); background:#fff7f7; padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; }
  .mistake .w { font-size:17px; }
  .mistake .w s { color:var(--bad); } .w s { text-decoration:none; } .w u { text-decoration-thickness:2px; text-underline-offset:3px; }
  .mistake .w b { color:var(--ok); }
  .mistake .r { color:#444; font-size:14px; margin-top:4px; }
  .fixbtn { display:inline-block; margin-top:6px; padding:10px 16px; border-radius:12px; background:var(--bad); color:#fff; text-decoration:none; font-weight:600; font-size:15px; }
  .rightlist { margin:14px 0 10px; }
  .rightlist > summary { cursor:pointer; color:var(--ok); font-weight:600; list-style:none; user-select:none; margin-bottom:10px; }
  .rightlist > summary::-webkit-details-marker { display:none; }
  .rightlist > summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .rightlist[open] > summary::after { transform:rotate(180deg); }
  .good { border-left:4px solid var(--ok); background:#f3faf6; padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; animation:slide .25s ease-out; }
  .good .w { font-size:17px; } .good .w b { color:var(--ok); }
  .good .r { color:#444; font-size:14px; margin-top:4px; }
  .progress { position:relative; height:26px; margin:-6px 0 14px; font-size:13px; color:var(--muted); }
  .progress span { position:relative; z-index:1; }
  .progress i { position:absolute; left:0; bottom:0; height:4px; background:var(--accent); border-radius:999px; transition:width .3s ease; z-index:1; }
  .progress::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--line); border-radius:999px; }
  .kept { color:var(--ok); }
  .rsum { text-align:center; padding:10px 0 6px; }
  .rsum .big { font-size:48px; font-weight:800; line-height:1; }
  .rsum .pct { font-size:18px; color:var(--muted); margin-top:6px; }
  .rsum.good .big { color:var(--ok); } .rsum.mid .big { color:#c77700; } .rsum.low .big { color:var(--bad); }
  .ractions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .ractions button { font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; }
  .ractions .fixbtn { margin-top:0; padding:12px 20px; }
  .allok { color:var(--ok); font-weight:600; }
  .empty { color:var(--muted); line-height:1.6; }
  /* "?" hint bubble */
  /* easeOutBack (easings.net) for the playful "?" pop; strong ease-out for everything else */
  :root { --ease-back:cubic-bezier(0.34, 1.56, 0.64, 1); --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1); }
  .qmark { position:absolute; width:30px; height:30px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 4px 12px rgba(43,76,255,.35); z-index:10;
    transform:translate(-50%, -100%); transform-origin:50% 100%;
    transition:transform 280ms var(--ease-back), opacity 160ms var(--ease-out); }
  @starting-style { .qmark { opacity:0; transform:translate(-50%, -100%) translateY(10px) scale(.6); } }
  /* one ring ripples out as it lands */
  .qmark::after { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--teal, #62b5cf); opacity:0; pointer-events:none; animation:qping 700ms var(--ease-out) 140ms both; }
  @keyframes qping { from { opacity:.9; transform:scale(1); } to { opacity:0; transform:scale(2.1); } }
  /* the "?" tips in like it's thinking */
  .qmark span { display:inline-block; animation:qtilt 520ms var(--ease-out) 80ms both; }
  @keyframes qtilt { 0% { transform:rotate(-24deg); } 55% { transform:rotate(10deg); } 100% { transform:rotate(0); } }
  @media (hover:hover) and (pointer:fine) { .qmark:hover { transform:translate(-50%, -100%) scale(1.1); transition-duration:160ms; } }
  .qmark:active { transform:translate(-50%, -100%) scale(.92); transition-duration:100ms; }
  /* exit = the entrance in reverse: the blank swallows it */
  .qmark.out { opacity:0; transform:translate(-50%, -100%) translateY(14px) scale(.35); transition:transform 260ms var(--ease-in-out), opacity 160ms var(--ease-out) 100ms; }

  /* tip grows out of the spot where the "?" was */
  .tip { position:absolute; max-width:300px; background:var(--ink); color:#fff; font-size:14px; line-height:1.45; padding:10px 12px; border-radius:10px; z-index:11;
    transform:translate(-50%, -100%); transform-origin:50% 100%;
    transition:transform 200ms var(--ease-out), opacity 160ms var(--ease-out); }
  @starting-style { .tip { opacity:0; transform:translate(-50%, -100%) translateY(6px) scale(.94); } }
  .tip b { display:block; margin-bottom:3px; color:#aab8ff; }
  .tip b, .tip span { transition:opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }
  .tip span { display:block; transition-delay:50ms; }
  @starting-style { .tip b, .tip span { opacity:0; transform:translateY(4px); } }
  .tip.out { opacity:0; transform:translate(-50%, -100%) translateY(14px) scale(.3); transition:transform 260ms var(--ease-in-out), opacity 160ms var(--ease-out) 100ms; }
  @media (prefers-reduced-motion: reduce) {
    .qmark, .tip, .tip b, .tip span { transition:opacity 150ms ease; }
    @starting-style { .qmark, .tip { transform:translate(-50%, -100%); } .tip b, .tip span { transform:none; } }
    .qmark::after, .qmark span { animation:none; }
    .qmark.out, .tip.out, .qmark:hover, .qmark:active { transform:translate(-50%, -100%); }
  }
  .full { margin-top:8px; font-size:14px; }
  .full summary { cursor:pointer; color:var(--accent); font-weight:600; list-style:none; user-select:none; }
  .full summary::-webkit-details-marker { display:none; }
  .full summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .full[open] summary::after { transform:rotate(180deg); }
  .full .body { margin-top:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; color:#333; line-height:1.55; animation:slide .25s ease-out; }
  .full .body p { margin:0 0 8px; } .full .body p:last-child { margin:0; }
  .full .body .src { font-size:12px; color:var(--muted); margin-bottom:8px; }
  @keyframes slide { from { opacity:0; transform:translateY(-8px); } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%233a3399%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial%27 font-weight=%27bold%27 font-size=%2738%27 fill=%27%23fffdf9%27 text-anchor=%27middle%27%3E%C4%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="index.html">← Visos temos</a>
    <a class="mode" id="modeLink" href="klaidos.html">Mano klaidos →</a>
  </div>
  <h1 id="title">Rašybos treniruoklis</h1>
  <p class="sub" id="sub">Įrašyk praleistas raides. Skliaustuose esančius žodžius parašyk kartu arba skyrium. Užlaikyk pelę ant langelio 1 sek. – atsiras užuomina.</p>
  <div class="card">
    <div class="progress" id="progress"></div>
    <div class="sentence" id="sentence"></div>
    <div class="actions" id="actions">
      <button class="primary" id="check">Tikrinti</button>
      <button class="secondary" id="next">Kitas sakinys →</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</main>

<script src="data.js"></script>
<script src="round.js"></script>
<script>
// ?klaidos = practise only blanks you got wrong before
const MISTAKE_MODE = new URLSearchParams(location.search).has("klaidos");
if (MISTAKE_MODE) {
  document.getElementById("title").textContent = "Klaidų treniruotė";
  document.getElementById("sub").textContent = "Sakiniai, kuriuose suklydai. Užpildyk visus langelius – atsakyk teisingai 2 kartus iš eilės ir klaida keliauja į pataisytas.";
  document.getElementById("modeLink").textContent = "← Klaidų sąrašas";
}

// fixing = { i, keys, given } while redoing a round's mistakes (see round.js): only keys are blanks
let current = -1, parts = [], focused = null, checked = false, fixing = null;

function load(i, fix = null) {
  current = i; checked = false; fixing = fix;
  document.getElementById("sentence").classList.toggle("fixing", !!fix);
  parts = parse(SENTENCES[i]);
  document.getElementById("sentence").innerHTML = parts.map((p, k) => {
    if (p.t !== undefined) return esc(p.t);
    if (fix && !fix.keys.includes(k)) return `<span class="kept">${esc(fix.given[k] ?? "")}</span>`;
    if (p.word) return `<span class="hint">(${esc(p.hint)})</span> <input data-k="${k}" style="width:${Math.max(p.hint.length, 8) + 2}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    return `<input data-k="${k}" style="width:${Math.max(...p.ans.split("/").map(a => a.length)) + 1.6}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }).join("");
  document.getElementById("result").innerHTML = "";
  hideHint();
  document.querySelector(".sentence input")?.focus();
}

function check() {
  if (document.getElementById("actions").style.display === "none") return;
  const inputs = [...document.querySelectorAll(".sentence input")];
  const first = !checked; checked = true;
  let wrong = [], correct = [];
  const given = { ...fixing?.given };
  inputs.forEach(inp => {
    const k = +inp.dataset.k, p = parts[k];
    const ok = p.ans.split("/").some(a => norm(inp.value) === norm(a));
    if (ok) given[k] = p.ans.split("/").find(a => norm(a) === norm(inp.value));
    inp.classList.toggle("ok", ok);
    inp.classList.toggle("bad", !ok);
    if (first && inp.value.trim()) recordAnswer(current, k, ok, inp.value.trim());
    if (!ok) wrong.push({ k, p, val: inp.value.trim() });
    else correct.push({ k, p });
  });
  const total = inputs.length, good = total - wrong.length;
  let html = `<div class="score">${good} / ${total} teisingai</div>`, mHtml = "";
  if (!wrong.length) html += `<div class="allok">Viskas teisingai! 🎉</div>`;
  wrong.forEach(({ k, p, val }) => {
    const right = p.word ? p.ans : wordAround(parts, k, p.ans.split("/")[0]);
    const yours = p.word ? (val || "—") : wordAround(parts, k, val || "_");
    mHtml += mistakeRow(fixLine(yours, right), p.rule, fullRule(p.cat));
  });
  html += mHtml;
  // Rules for the words you got right, folded away
  if (correct.length) html += `<details class="rightlist"><summary>Teisingi žodžiai (${correct.length})</summary>${correct.map(({ k, p }) => {
    const w = p.word ? p.ans : wordAround(parts, k, p.ans.split("/")[0]);
    return `<div class="good"><div class="w"><b>${esc(w)}</b></div><div class="r">${esc(p.rule)}</div>${fullRule(p.cat)}</div>`;
  }).join("")}</details>`;
  const n =Object.keys(loadMistakes()).length;
  if (n && !MISTAKE_MODE) html += `<a class="fixbtn" href="rasyba.html?klaidos">🎯 Taisyti klaidas (${n}) →</a>`;
  document.getElementById("result").innerHTML = html;
  if (first) roundAdd(good, total, mHtml, wrong.length ? { i: current, keys: wrong.map(w => w.k), given } : null);
  updateModeLink();
}

// Show the mistake count in the top-right link
function updateModeLink() {
  if (MISTAKE_MODE) return;
  const n = Object.keys(loadMistakes()).length;
  document.getElementById("modeLink").textContent = n ? `Mano klaidos (${n}) →` : "Mano klaidos →";
}
updateModeLink();

// Shuffled deck: every sentence comes once per round, never twice in a row
let deck = [];
function pool() {
  if (!MISTAKE_MODE) return SENTENCES.map((_, i) => i);
  const m = loadMistakes();
  return [...new Set(Object.keys(m).map(id => +id.split(":")[0]))].filter(i => i < SENTENCES.length);
}
function nextRandom() {
  if (MISTAKE_MODE) deck = deck.filter(i => pool().includes(i));
  if (!deck.length) {
    deck = pool();
    if (!deck.length) return showNoMistakes();
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const last = deck.length - 1;
    if (deck.length > 1 && deck[last] === current) [deck[last], deck[0]] = [deck[0], deck[last]];
  }
  load(deck.pop());
}
function showNoMistakes() {
  document.getElementById("sentence").innerHTML = `<div class="empty">Klaidų neliko! 🎉<br>Paspręsk daugiau sakinių <a href="rasyba.html">įprastame režime</a>, o čia atsiras tie, kuriuose suklysi.</div>`;
  document.getElementById("actions").style.display = "none";
  document.getElementById("result").innerHTML = "";
}

document.getElementById("check").onclick = check;
document.getElementById("next").onclick = roundNext;
const sentenceEl = document.getElementById("sentence");
sentenceEl.addEventListener("focusin", e => { if (e.target.tagName === "INPUT") focused = e.target; });
sentenceEl.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); check(); } });
arrowKeys(sentenceEl);

// Hold the mouse on a blank for 1 s → "?" appears above it → click shows which rule to use
let holdTimer = null, qEl = null, tipEl = null, qFor = null;
// Play the exit, then remove
function fadeOut(el) { if (!el) return; el.classList.add("out"); el.style.pointerEvents = "none"; setTimeout(() => el.remove(), 280); }
function hideHint(keepHold) { if (keepHold !== true) clearTimeout(holdTimer); clearTimeout(leaveTimer); fadeOut(qEl); fadeOut(tipEl); qEl = tipEl = qFor = null; }
function placeAbove(el, target, gap) {
  const r = target.getBoundingClientRect();
  const half = Math.min(el.offsetWidth / 2, innerWidth / 2);
  el.style.left = (Math.min(Math.max(r.left + r.width / 2, half + 8), innerWidth - half - 8) + scrollX) + "px";
  el.style.top = (r.top + scrollY - gap) + "px";
}
function showQ(inp) {
  if (qFor === inp || !inp.isConnected) return;
  hideHint();
  qFor = inp;
  qEl = document.createElement("button");
  qEl.className = "qmark"; qEl.innerHTML = "<span>?</span>"; qEl.title = "Kokią taisyklę taikyti?";
  document.body.appendChild(qEl);
  placeAbove(qEl, inp, 6);
  qEl.onclick = e => {
    e.stopPropagation();
    const cat = CATS[parts[+inp.dataset.k].cat];
    fadeOut(tipEl);
    tipEl = document.createElement("div");
    tipEl.className = "tip";
    tipEl.innerHTML = cat ? `<b>${esc(cat.name)}</b><span>${esc(cat.hint)}</span>` : "<span>Užuominos šiam langeliui nėra.</span>";
    document.body.appendChild(tipEl);
    placeAbove(tipEl, inp, 8);
    fadeOut(qEl); qEl = null;
  };
}
sentenceEl.addEventListener("mouseover", e => {
  if (e.target.tagName !== "INPUT" || e.target === qFor) return;
  clearTimeout(holdTimer);
  const inp = e.target;
  holdTimer = setTimeout(() => showQ(inp), 1000);
});
sentenceEl.addEventListener("mouseout", e => { if (e.target.tagName === "INPUT") clearTimeout(holdTimer); });

// Hide the "?" / tip shortly after the mouse leaves the blank, the "?" and the tip
let leaveTimer = null;
document.addEventListener("mouseover", e => {
  if (!qFor) return;
  const inside = e.target === qFor || e.target.closest(".qmark, .tip");
  clearTimeout(leaveTimer);
  if (!inside) leaveTimer = setTimeout(() => hideHint(true), 500);
});
document.addEventListener("click", e => { if (!e.target.closest(".qmark, .tip")) hideHint(); });
addEventListener("resize", () => hideHint());
document.addEventListener("keydown", e => { if (e.key === "Escape") hideHint(); });

roundStart(() => Math.min(ROUND_SIZE, pool().length), "rasyba.html?klaidos", nextRandom, fix => load(fix.i, fix.keys ? fix : null));
nextRandom();
</script>
<script src="demo-report.js"></script><!-- DEMO: remove later -->
<script src="hyphen.js"></script>
</body>
</html>
