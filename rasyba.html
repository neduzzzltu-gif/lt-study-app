<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rašybos treniruoklis</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --ok:#1f8a4c; --bad:#c62828; --accent:#2b4cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 120px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; }
  .mode { font-size:14px; color:var(--accent); text-decoration:none; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .sentence { font-size:19px; line-height:2.3; }
  .sentence input { font:inherit; font-size:18px; text-align:center; border:none; border-bottom:2px solid var(--accent); background:#eef1ff; border-radius:6px 6px 0 0; padding:0 2px; margin:0 1px; outline:none; }
  .sentence input:focus { background:#dfe5ff; }
  .sentence input.ok { border-color:var(--ok); background:#e6f5ec; color:var(--ok); }
  .sentence input.bad { border-color:var(--bad); background:#fdecec; color:var(--bad); text-decoration:line-through; }
  .hint { color:var(--muted); font-size:15px; }
  .actions { display:flex; gap:10px; margin-top:20px; }
  .actions button { font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; }
  .primary { background:var(--ink); color:#fff; }
  .secondary { background:var(--line); color:var(--ink); }
  .result { margin-top:20px; }
  .score { font-weight:600; margin-bottom:12px; }
  .mistake { border-left:4px solid var(--bad); background:#fff7f7; padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; }
  .mistake .w { font-size:17px; }
  .mistake .w s { color:var(--bad); }
  .mistake .w b { color:var(--ok); }
  .mistake .r { color:#444; font-size:14px; margin-top:4px; }
  .allok { color:var(--ok); font-weight:600; }
  .empty { color:var(--muted); line-height:1.6; }
  .keys { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px; display:flex; justify-content:center; flex-wrap:wrap; gap:6px; }
  .keys button { width:42px; height:42px; font-size:18px; border:1px solid var(--line); background:var(--bg); border-radius:10px; cursor:pointer; }
  /* "?" hint bubble */
  .qmark { position:absolute; width:28px; height:28px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 4px 12px rgba(43,76,255,.35); transform:translate(-50%, -100%); animation:pop .18s ease-out; z-index:10; }
  .tip { position:absolute; max-width:300px; background:var(--ink); color:#fff; font-size:14px; line-height:1.45; padding:10px 12px; border-radius:10px; transform:translate(-50%, -100%); z-index:11; animation:pop .18s ease-out; }
  .tip b { display:block; margin-bottom:3px; color:#aab8ff; }
  @keyframes pop { from { opacity:0; transform:translate(-50%, -85%) scale(.9); } }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="index.html">← Visos temos</a>
    <a class="mode" id="modeLink" href="klaidos.html">Mano klaidos →</a>
  </div>
  <h1 id="title">Rašybos treniruoklis</h1>
  <p class="sub" id="sub">Įrašyk praleistas raides. Skliaustuose esančius žodžius parašyk kartu arba skyrium. Užlaikyk pelę ant langelio 2 sek. – atsiras užuomina.</p>
  <div class="card">
    <div class="sentence" id="sentence"></div>
    <div class="actions" id="actions">
      <button class="primary" id="check">Tikrinti</button>
      <button class="secondary" id="next">Kitas sakinys →</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</main>
<div class="keys" id="keys"></div>

<script src="data.js"></script>
<script>
// ?klaidos = practise only blanks you got wrong before
const MISTAKE_MODE = new URLSearchParams(location.search).has("klaidos");
if (MISTAKE_MODE) {
  document.getElementById("title").textContent = "Klaidų treniruotė";
  document.getElementById("sub").textContent = "Tik tie langeliai, kuriuose suklydai. Atsakyk teisingai 2 kartus iš eilės – klaida dingsta.";
  document.getElementById("modeLink").textContent = "← Klaidų sąrašas";
}

let current = -1, parts = [], focused = null, checked = false;

// Which blanks are inputs in this sentence (all, or only past mistakes)
function activeBlanks(i) {
  const ps = parse(SENTENCES[i]);
  if (!MISTAKE_MODE) return null;
  const m = loadMistakes();
  return new Set(ps.map((_, k) => k).filter(k => m[i + ":" + k]));
}

function load(i) {
  current = i; checked = false;
  parts = parse(SENTENCES[i]);
  const only = activeBlanks(i);
  document.getElementById("sentence").innerHTML = parts.map((p, k) => {
    if (p.t !== undefined) return esc(p.t);
    if (only && !only.has(k)) return esc(p.word ? p.ans : p.ans.split("/")[0]);
    if (p.word) return `<span class="hint">(${esc(p.hint)})</span> <input data-k="${k}" style="width:${Math.max(p.hint.length, 8) + 2}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    return `<input data-k="${k}" style="width:${Math.max(...p.ans.split("/").map(a => a.length)) + 1.6}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }).join("");
  document.getElementById("result").innerHTML = "";
  hideHint();
  document.querySelector(".sentence input")?.focus();
}

function check() {
  const inputs = [...document.querySelectorAll(".sentence input")];
  const first = !checked; checked = true;
  let wrong = [];
  inputs.forEach(inp => {
    const k = +inp.dataset.k, p = parts[k];
    const ok = p.ans.split("/").some(a => norm(inp.value) === norm(a));
    inp.classList.toggle("ok", ok);
    inp.classList.toggle("bad", !ok);
    if (first && inp.value.trim()) recordAnswer(current, k, ok, inp.value.trim());
    if (!ok) wrong.push({ k, p, val: inp.value.trim() });
  });
  const total = inputs.length, good = total - wrong.length;
  let html = `<div class="score">${good} / ${total} teisingai</div>`;
  if (!wrong.length) html += `<div class="allok">Viskas teisingai! 🎉</div>`;
  wrong.forEach(({ k, p, val }) => {
    const right = p.word ? p.ans : wordAround(parts, k, p.ans.split("/")[0]);
    const yours = p.word ? (val || "—") : wordAround(parts, k, val || "_");
    html += `<div class="mistake"><div class="w"><s>${esc(yours)}</s> → <b>${esc(right)}</b></div><div class="r">${esc(p.rule)}</div></div>`;
  });
  document.getElementById("result").innerHTML = html;
}

// Shuffled deck: every sentence comes once per round, never twice in a row
let deck = [];
function pool() {
  if (!MISTAKE_MODE) return SENTENCES.map((_, i) => i);
  const m = loadMistakes();
  return [...new Set(Object.keys(m).map(id => +id.split(":")[0]))].filter(i => i < SENTENCES.length);
}
function nextRandom() {
  if (MISTAKE_MODE) deck = deck.filter(i => pool().includes(i));
  if (!deck.length) {
    deck = pool();
    if (!deck.length) return showNoMistakes();
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const last = deck.length - 1;
    if (deck.length > 1 && deck[last] === current) [deck[last], deck[0]] = [deck[0], deck[last]];
  }
  load(deck.pop());
}
function showNoMistakes() {
  document.getElementById("sentence").innerHTML = `<div class="empty">Klaidų neliko! 🎉<br>Paspręsk daugiau sakinių <a href="rasyba.html">įprastame režime</a>, o čia atsiras tie, kuriuose suklysi.</div>`;
  document.getElementById("actions").style.display = "none";
  document.getElementById("result").innerHTML = "";
}

document.getElementById("check").onclick = check;
document.getElementById("next").onclick = nextRandom;
const sentenceEl = document.getElementById("sentence");
sentenceEl.addEventListener("focusin", e => { if (e.target.tagName === "INPUT") focused = e.target; });
sentenceEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });

// Hold the mouse on a blank for 2 s → "?" appears above it → click shows which rule to use
let holdTimer = null, qEl = null, tipEl = null, qFor = null;
function hideHint() { clearTimeout(holdTimer); qEl?.remove(); tipEl?.remove(); qEl = tipEl = qFor = null; }
function placeAbove(el, target, gap) {
  const r = target.getBoundingClientRect();
  const half = Math.min(el.offsetWidth / 2, innerWidth / 2);
  el.style.left = (Math.min(Math.max(r.left + r.width / 2, half + 8), innerWidth - half - 8) + scrollX) + "px";
  el.style.top = (r.top + scrollY - gap) + "px";
}
function showQ(inp) {
  if (qFor === inp || !inp.isConnected) return;
  hideHint();
  qFor = inp;
  qEl = document.createElement("button");
  qEl.className = "qmark"; qEl.textContent = "?"; qEl.title = "Kokią taisyklę taikyti?";
  document.body.appendChild(qEl);
  placeAbove(qEl, inp, 6);
  qEl.onclick = e => {
    e.stopPropagation();
    const cat = CATS[parts[+inp.dataset.k].cat];
    tipEl?.remove();
    tipEl = document.createElement("div");
    tipEl.className = "tip";
    tipEl.innerHTML = cat ? `<b>${esc(cat.name)}</b>${esc(cat.hint)}` : "Užuominos šiam langeliui nėra.";
    document.body.appendChild(tipEl);
    placeAbove(tipEl, inp, 8);
    qEl.style.display = "none";
  };
}
sentenceEl.addEventListener("mouseover", e => {
  if (e.target.tagName !== "INPUT" || e.target === qFor) return;
  clearTimeout(holdTimer);
  const inp = e.target;
  holdTimer = setTimeout(() => showQ(inp), 2000);
});
sentenceEl.addEventListener("mouseout", e => { if (e.target.tagName === "INPUT") clearTimeout(holdTimer); });
document.addEventListener("click", e => { if (!e.target.closest(".qmark, .tip")) hideHint(); });
addEventListener("resize", hideHint);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideHint(); });

// On-screen LT letters for keyboards without them
const keys = document.getElementById("keys");
keys.innerHTML = "ą č ę ė į š ų ū ž y".split(" ").map(c => `<button>${c}</button>`).join("");
keys.addEventListener("pointerdown", e => e.preventDefault());
keys.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !focused) return;
  const s = focused.selectionStart, en = focused.selectionEnd;
  focused.value = focused.value.slice(0, s) + b.textContent + focused.value.slice(en);
  focused.setSelectionRange(s + 1, s + 1);
  focused.focus();
});

nextRandom();
</script>
</body>
</html>
