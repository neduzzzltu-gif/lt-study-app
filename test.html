<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testas</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --ok:#1f8a4c; --bad:#c62828; --accent:#2b4cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .back { display:inline-block; color:var(--muted); text-decoration:none; font-size:14px; margin-bottom:12px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:17px; margin:28px 0 12px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; line-height:1.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .btn { font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; text-decoration:none; display:inline-block; }
  .primary { background:var(--ink); color:#fff; }
  .secondary { background:var(--line); color:var(--ink); }
  .danger { background:var(--bad); color:#fff; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }

  /* start */
  .choices { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .choice { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; font:inherit; transition:transform .15s, border-color .15s; }
  .choice:hover { transform:translateY(-2px); border-color:var(--accent); }
  .choice b { display:block; font-size:18px; margin:8px 0 4px; }
  .choice span { color:var(--muted); font-size:14px; }

  /* test bar */
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; }
  .dot { width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:13px; cursor:pointer; font-family:inherit; }
  .dot.done { background:#e4e9ff; border-color:#c6d0ff; }
  .dot.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .timer { font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; padding:6px 12px; border-radius:10px; background:var(--card); border:1px solid var(--line); }
  .timer.low { color:var(--bad); border-color:var(--bad); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.55; } }
  .tag { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }

  /* sentence */
  .sentence { font-size:19px; line-height:2.3; }
  .sentence input { font:inherit; font-size:18px; text-align:center; border:none; border-bottom:2px solid var(--accent); background:#eef1ff; border-radius:6px 6px 0 0; padding:0 2px; margin:0 1px; outline:none; }
  .sentence input:focus { background:#dfe5ff; }
  .hint { color:var(--muted); font-size:15px; }
  .gap { display:inline-block; min-width:14px; height:28px; padding:0 3px; margin:0 1px; vertical-align:middle; border:none; border-radius:6px; background:transparent; font:inherit; font-size:20px; font-weight:700; color:var(--accent); cursor:pointer; line-height:28px; }
  .gap:hover { background:#e4e9ff; }
  .gap.set { background:#eef1ff; }
  .picker { position:absolute; display:flex; gap:4px; padding:5px; background:var(--ink); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); transform:translate(-50%, -100%); z-index:10; }
  .picker::after { content:""; position:absolute; left:50%; bottom:-5px; width:10px; height:10px; background:var(--ink); transform:translateX(-50%) rotate(45deg); }
  .picker button { width:36px; height:36px; border:none; border-radius:8px; background:#2c2c30; color:#fff; font:inherit; font-size:20px; font-weight:700; cursor:pointer; position:relative; z-index:1; }
  .picker button:hover { background:var(--accent); }
  .picker button.cur { background:#4a4a52; box-shadow:inset 0 0 0 2px #aab8ff; }

  /* results */
  .score { text-align:center; padding:28px 22px; }
  .score .big { font-size:56px; font-weight:800; line-height:1; }
  .score .pct { font-size:20px; color:var(--muted); margin-top:6px; }
  .score .meta { color:var(--muted); font-size:14px; margin-top:12px; }
  .score.good .big { color:var(--ok); } .score.mid .big { color:#c77700; } .score.low .big { color:var(--bad); }
  .sres { margin-bottom:14px; }
  .sres .head { font-size:14px; color:var(--muted); margin-bottom:8px; }
  .mistake { border-left:4px solid var(--bad); background:#fff7f7; padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:8px; }
  .mistake .w { font-size:17px; } .mistake .w s { color:var(--bad); } .mistake .w b { color:var(--ok); }
  .mistake .r { color:#444; font-size:14px; margin-top:4px; }
  .allok { color:var(--ok); font-weight:600; }
  .full { margin-top:8px; font-size:14px; }
  .full summary { cursor:pointer; color:var(--accent); font-weight:600; list-style:none; user-select:none; }
  .full summary::-webkit-details-marker { display:none; }
  .full summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .full[open] summary::after { transform:rotate(180deg); }
  .full .body { margin-top:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; color:#333; line-height:1.55; animation:slide .25s ease-out; }
  .full .body p { margin:0 0 8px; } .full .body p:last-child { margin:0; }
  @keyframes slide { from { opacity:0; transform:translateY(-8px); } }
</style>
</head>
<body>
<main id="app"></main>

<script src="data.js"></script>
<script src="skyryba-data.js"></script>
<script>
const COUNT = 10, MINUTES = 15;
const MARKS = ["", ",", "–", ":"];
const app = document.getElementById("app");

// state: items [{type:"r"|"s", i, only:Set|null, fixed:{}}], answers [{key:value}], pos
let state = null, timerId = null;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (n, len) => shuffle([...Array(len).keys()]).slice(0, n);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

// ---------- start ----------
function startScreen() {
  stopTimer();
  app.innerHTML = `
    <a class="back" href="index.html">← Visos temos</a>
    <h1>Testas</h1>
    <p class="sub">${COUNT} atsitiktinių sakinių · ${MINUTES} minučių. Atsakymai parodomi tik pabaigoje.</p>
    <div class="choices">
      <button class="choice" data-t="r"><div>✍️</div><b>Rašyba</b><span>Praleistos raidės, kartu ar skyrium</span></button>
      <button class="choice" data-t="s"><div>❝</div><b>Skyryba</b><span>Kableliai, brūkšniai, dvitaškiai</span></button>
      <button class="choice" data-t="m"><div>🔀</div><b>Mišrus</b><span>Pusė rašybos, pusė skyrybos</span></button>
    </div>`;
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => startTest(b.dataset.t));
}

function startTest(t) {
  let items;
  if (t === "r") items = pick(COUNT, SENTENCES.length).map(i => ({ type: "r", i }));
  else if (t === "s") items = pick(COUNT, SK_SENTENCES.length).map(i => ({ type: "s", i }));
  else items = shuffle([...pick(COUNT / 2, SENTENCES.length).map(i => ({ type: "r", i })), ...pick(COUNT / 2, SK_SENTENCES.length).map(i => ({ type: "s", i }))]);
  state = { kind: t, items: items.map(x => ({ ...x, only: null, fixed: {} })), answers: items.map(() => ({})), pos: 0, redo: false, started: Date.now(), left: MINUTES * 60 };
  startTimer();
  showItem();
}

// ---------- timer ----------
function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    state.left--;
    const el = document.getElementById("timer");
    if (el) { el.textContent = fmt(Math.max(state.left, 0)); el.classList.toggle("low", state.left <= 60); }
    if (state.left <= 0) { stopTimer(); finish(true); }
  }, 1000);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

// ---------- one sentence ----------
function showItem() {
  hidePicker();
  const it = state.items[state.pos], ans = state.answers[state.pos], n = state.items.length;
  const dots = state.items.map((_, k) => `<button class="dot ${k === state.pos ? "on" : ""} ${Object.values(state.answers[k]).some(v => v) ? "done" : ""}" data-k="${k}">${k + 1}</button>`).join("");
  const last = state.pos === n - 1;
  app.innerHTML = `
    <div class="bar">
      <div class="dots">${dots}</div>
      ${state.redo ? `<div class="timer">Taisymas</div>` : `<div class="timer ${state.left <= 60 ? "low" : ""}" id="timer">${fmt(state.left)}</div>`}
    </div>
    <div class="card">
      <div class="tag">${it.type === "r" ? "Rašyba – įrašyk praleistas raides" : "Skyryba – padėk trūkstamus ženklus"}</div>
      <div class="sentence" id="sentence">${it.type === "r" ? renderR(it, ans) : renderS(it, ans)}</div>
      <div class="row">
        <button class="btn secondary" id="prev" ${state.pos === 0 ? "disabled style='opacity:.4'" : ""}>← Atgal</button>
        ${last ? `<button class="btn primary" id="finish">Baigti ${state.redo ? "taisymą" : "testą"}</button>` : `<button class="btn primary" id="next">Kitas →</button>`}
        ${!last ? `<button class="btn secondary" id="finish">Baigti</button>` : ""}
      </div>
    </div>
    ${state.redo && state.review ? `<div class="row"><button class="btn secondary" id="review">${state.showReview ? "Slėpti klaidas ▴" : "📋 Peržiūrėti klaidas ▾"}</button></div>
    ${state.showReview ? `<div style="margin-top:14px">${state.review}</div>` : ""}` : ""}`;
  document.getElementById("review") && (document.getElementById("review").onclick = () => { state.showReview = !state.showReview; showItem(); });
  app.querySelectorAll(".dot").forEach(d => d.onclick = () => go(+d.dataset.k));
  document.getElementById("prev").onclick = () => state.pos > 0 && go(state.pos - 1);
  document.getElementById("next") && (document.getElementById("next").onclick = () => go(state.pos + 1));
  document.getElementById("finish").onclick = () => finish(false);
  wireSentence(it, ans);
  app.querySelector(".sentence input")?.focus();
}
function go(k) { state.pos = k; showItem(); }

// Rašyba sentence: inputs for blanks (only past-wrong blanks in redo)
function renderR(it, ans) {
  return parse(SENTENCES[it.i]).map((p, k) => {
    if (p.t !== undefined) return esc(p.t);
    if (it.only && !it.only.has(k)) return esc(it.fixed[k] ?? (p.word ? p.ans : p.ans.split("/")[0]));
    const v = esc(ans[k] || "");
    if (p.word) return `<span class="hint">(${esc(p.hint)})</span> <input data-k="${k}" value="${v}" style="width:${Math.max(p.hint.length, 8) + 2}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    return `<input data-k="${k}" value="${v}" style="width:${Math.max(...p.ans.split("/").map(a => a.length)) + 1.6}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }).join("");
}
// Skyryba sentence: clickable gaps (only past-wrong gaps in redo)
function renderS(it, ans) {
  const s = skParse(SK_SENTENCES[it.i]);
  return s.words.map((w, g) => {
    if (g >= s.gaps.length) return esc(w);
    if (it.only && !it.only.has(g)) {
      const a = it.fixed[g] ?? s.gaps[g].ans[0];
      return esc(w) + (a === "–" ? " – " : a ? a + " " : " ");
    }
    const m = ans[g] || "";
    return `${esc(w)}<button class="gap ${m ? "set" : ""}" data-g="${g}" data-m="${m}">${m}</button>`;
  }).join("");
}
function wireSentence(it, ans) {
  const el = document.getElementById("sentence");
  if (it.type === "r") {
    el.addEventListener("input", e => { if (e.target.dataset.k) { ans[e.target.dataset.k] = e.target.value; markDot(); } });
    el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); state.pos < state.items.length - 1 ? go(state.pos + 1) : finish(false); } });
  } else {
    el.addEventListener("click", e => {
      const b = e.target.closest(".gap"); if (!b) return;
      if (matchMedia("(hover: none)").matches) return showPicker(b, ans);
      setMark(b, MARKS[(MARKS.indexOf(b.dataset.m) + 1) % MARKS.length], ans);
      if (pickFor === b) showPicker(b, ans);
    });
    el.addEventListener("mouseover", e => {
      const gap = e.target.closest(".gap");
      if (gap && gap !== pickFor) { clearTimeout(openTimer); openTimer = setTimeout(() => showPicker(gap, ans), 120); }
    });
  }
}
function markDot() {
  const d = app.querySelector(`.dot[data-k="${state.pos}"]`);
  d?.classList.toggle("done", Object.values(state.answers[state.pos]).some(v => v));
}
function setMark(b, mark, ans) {
  b.dataset.m = mark; b.textContent = mark; b.className = "gap" + (mark ? " set" : "");
  ans[b.dataset.g] = mark; markDot();
}

// Hover choices for skyryba gaps
let picker = null, pickFor = null, openTimer = null, closeTimer = null;
function hidePicker() { clearTimeout(openTimer); clearTimeout(closeTimer); picker?.remove(); picker = pickFor = null; }
function showPicker(b, ans) {
  hidePicker();
  pickFor = b;
  picker = document.createElement("div");
  picker.className = "picker";
  picker.innerHTML = MARKS.map(m => `<button data-mark="${m}" class="${m === b.dataset.m ? "cur" : ""}">${m || "∅"}</button>`).join("");
  document.body.appendChild(picker);
  const r = b.getBoundingClientRect(), half = picker.offsetWidth / 2;
  picker.style.left = (Math.min(Math.max(r.left + r.width / 2, half + 8), innerWidth - half - 8) + scrollX) + "px";
  picker.style.top = (r.top + scrollY - 10) + "px";
  picker.addEventListener("click", e => { const c = e.target.closest("button"); if (!c) return; setMark(b, c.dataset.mark, ans); hidePicker(); });
}
document.addEventListener("mouseover", e => {
  if (!pickFor) return;
  clearTimeout(closeTimer);
  if (e.target !== pickFor && !e.target.closest(".picker")) closeTimer = setTimeout(hidePicker, 300);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hidePicker(); });
addEventListener("resize", hidePicker);

// ---------- grading ----------
// Returns { points, max, mistakes:[{yours, right, rule, full, key}] } for one item
function grade(it, ans) {
  const out = { points: 0, max: 0, mistakes: [], ok: {} };
  if (it.type === "r") {
    const parts = parse(SENTENCES[it.i]);
    parts.forEach((p, k) => {
      if (p.t !== undefined || (it.only && !it.only.has(k))) return;
      const val = (ans[k] || "").trim(), ok = p.ans.split("/").some(a => norm(val) === norm(a));
      out.max++;
      if (ok) { out.points++; out.ok[k] = val; }
      else out.mistakes.push({
        key: k, rule: p.rule, full: fullRule(p.cat),
        right: p.word ? p.ans : wordAround(parts, k, p.ans.split("/")[0]),
        yours: p.word ? (val || "—") : wordAround(parts, k, val || "_")
      });
      recordAnswer(it.i, k, ok, val || "—");
    });
  } else {
    const s = skParse(SK_SENTENCES[it.i]), a = s.words;
    const val = g => (it.only && !it.only.has(g)) ? (it.fixed[g] ?? s.gaps[g].ans[0]) : (ans[g] || "");
    const pairVals = {};
    s.gaps.forEach((gap, g) => { if (gap.pair) (pairVals[gap.pair] = pairVals[gap.pair] || new Set()).add(val(g)); });
    s.gaps.forEach((gap, g) => {
      if (it.only && !it.only.has(g)) return;
      const v = val(g), ok = gap.ans.includes(v) && !(gap.pair && pairVals[gap.pair].size > 1);
      if (!gap.def) out.max++;
      if (ok) { if (!gap.def) out.points++; out.ok[g] = v; }
      else {
        if (gap.def) out.max++; // an extra mark counts as a lost point
        out.mistakes.push({ key: g, rule: gap.rule, full: skFullRule(gap.cat), right: gap.ans.map(x => skJoin(a[g], x, a[g + 1])).join("  arba  "), yours: skJoin(a[g], v, a[g + 1]) });
      }
      if (!gap.def || !ok) skRecord(it.i, g, ok, v);
    });
  }
  return out;
}

// ---------- results ----------
function finish(timeUp) {
  hidePicker();
  if (!timeUp && !state.redo) {
    const empty = state.items.filter((_, k) => !Object.values(state.answers[k]).some(v => v)).length;
    if (empty && !confirm(`Dar ${empty} sakinių neatsakei. Vis tiek baigti?`)) return;
  }
  stopTimer();
  const used = state.redo ? null : Math.min(MINUTES * 60, Math.round((Date.now() - state.started) / 1000));
  const results = state.items.map((it, k) => ({ it, ...grade(it, state.answers[k]) }));
  const points = results.reduce((s, r) => s + r.points, 0), max = results.reduce((s, r) => s + r.max, 0);
  const pct = max ? Math.round(points / max * 100) : 100;
  const wrongItems = results.filter(r => r.mistakes.length);
  const nMist = wrongItems.reduce((s, r) => s + r.mistakes.length, 0);

  app.innerHTML = `
    <a class="back" href="index.html">← Visos temos</a>
    <h1>${state.redo ? "Taisymo rezultatas" : "Testo rezultatas"}</h1>
    ${timeUp ? `<p class="sub">⏰ Laikas baigėsi – testas užbaigtas automatiškai.</p>` : ""}
    <div class="card score ${pct >= 85 ? "good" : pct >= 60 ? "mid" : "low"}">
      <div class="big">${points} / ${max}</div>
      <div class="pct">${pct}% teisingai</div>
      <div class="meta">${nMist} ${plural(nMist)}${used !== null ? ` · laikas ${fmt(used)}` : ""}</div>
    </div>
    <div class="row">
      ${nMist ? `<button class="btn danger" id="redo">🎯 Taisyti klaidas (${nMist})</button>` : ""}
      <button class="btn primary" id="again">Naujas testas</button>
    </div>
    ${nMist ? `<h2>Klaidos</h2>` : `<p class="allok" style="margin-top:20px">Be klaidų! 🎉</p>`}
    ${wrongItems.map(r => `
      <div class="sres">
        <div class="head">${state.items.indexOf(r.it) + 1}. ${r.it.type === "r" ? "Rašyba" : "Skyryba"}</div>
        ${r.mistakes.map(m => `<div class="mistake"><div class="w"><s>${esc(m.yours)}</s> → <b>${esc(m.right)}</b></div><div class="r">${esc(m.rule)}</div>${m.full}</div>`).join("")}
      </div>`).join("")}`;

  document.getElementById("again").onclick = startScreen;
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => {
    // Keep only the wrong spots; everything answered right stays filled in
    const items = wrongItems.map(r => ({
      type: r.it.type, i: r.it.i,
      only: new Set(r.mistakes.map(m => m.key)),
      fixed: { ...r.it.fixed, ...r.ok }
    }));
    const review = wrongItems.map(r => `
      <div class="sres">
        <div class="head">${r.it.type === "r" ? "Rašyba" : "Skyryba"}</div>
        ${r.mistakes.map(m => `<div class="mistake"><div class="w"><s>${esc(m.yours)}</s> → <b>${esc(m.right)}</b></div><div class="r">${esc(m.rule)}</div>${m.full}</div>`).join("")}
      </div>`).join("");
    state = { ...state, items, answers: items.map(() => ({})), pos: 0, redo: true, review, showReview: false };
    showItem();
  };
  scrollTo(0, 0);
}
const plural = n => n % 10 === 1 && n % 100 !== 11 ? "klaida" : (n % 10 === 0 || (n % 100 > 10 && n % 100 < 20)) ? "klaidų" : "klaidos";

startScreen();
</script>
</body>
</html>
