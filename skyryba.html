<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyrybos treniruoklis</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --ok:#1f8a4c; --bad:#c62828; --accent:#1c1915; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; }
  .mode { font-size:14px; color:var(--accent); text-decoration:none; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; line-height:1.5; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:22px; }
  .sentence { font-size:19px; line-height:2.2; }
  /* clickable gap between words */
  .gap { display:inline-block; min-width:14px; height:28px; padding:0 3px; margin:0 1px; vertical-align:middle; border:none; border-radius:6px; background:transparent; font:inherit; font-size:20px; font-weight:700; color:var(--accent); cursor:pointer; line-height:28px; transition:background .12s; }
  .gap:hover { background:var(--accent-soft); }
  .gap:focus { outline:2px solid var(--accent); outline-offset:1px; background:var(--sky); }
  .gap.set { background:var(--accent-softer); }
  .gap.ok { color:var(--ok); background:var(--ok-soft); }
  .gap.bad { color:var(--bad); background:var(--bad-soft); }
  .gap.miss { background:var(--bad-soft); box-shadow:inset 0 -2px 0 var(--bad); }
  .sentence.done .gap { cursor:default; }
  .gap.locked { cursor:default; color:var(--ink); font-weight:400; background:none; min-width:0; padding:0; }
  .actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .actions button { font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; }
  .primary { background:var(--btn); color:var(--btn-ink); }
  .secondary { background:var(--line); color:var(--ink); }
  .result { margin-top:20px; }
  .score { font-weight:600; margin-bottom:12px; }
  .mistake { border-left:4px solid var(--bad); background:var(--bad-soft); padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; }
  .mistake .w, .good .w { font-size:17px; }
  .mistake .w s { color:var(--bad); } .w s { text-decoration:none; } .w u { text-decoration-thickness:2px; text-underline-offset:3px; }
  .mistake .w b, .good .w b { color:var(--ok); }
  .mistake .r, .good .r { color:var(--muted); font-size:14px; margin-top:4px; }
  .allok { color:var(--ok); font-weight:600; }
  .progress { position:relative; height:26px; margin:-6px 0 14px; font-size:13px; color:var(--muted); }
  .progress span { position:relative; z-index:1; }
  .progress i { position:absolute; left:0; bottom:0; height:4px; background:var(--accent); border-radius:999px; transition:width .3s ease; z-index:1; }
  .progress::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--line); border-radius:999px; }
  .kept { color:var(--ok); font-weight:700; }
  .rsum { text-align:center; padding:10px 0 6px; }
  .rsum .big { font-size:48px; font-weight:800; line-height:1; }
  .rsum .pct { font-size:18px; color:var(--muted); margin-top:6px; }
  .rsum.good .big { color:var(--ok); } .rsum.mid .big { color:var(--orange); } .rsum.low .big { color:var(--bad); }
  .ractions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .ractions button { font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; }
  .ractions .fixbtn { margin-top:0; padding:12px 20px; }
  .empty { color:var(--muted); line-height:1.6; }
  .fixbtn { display:inline-block; margin-top:6px; padding:10px 16px; border-radius:12px; background:var(--bad); color:#fff; text-decoration:none; font-weight:600; font-size:15px; }
  .rightlist { margin:14px 0 10px; }
  .rightlist > summary { cursor:pointer; color:var(--ok); font-weight:600; list-style:none; user-select:none; margin-bottom:10px; }
  .rightlist > summary::-webkit-details-marker { display:none; }
  .rightlist > summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .rightlist[open] > summary::after { transform:rotate(180deg); }
  .good { border-left:4px solid var(--ok); background:var(--ok-soft); padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; animation:slide .25s ease-out; }
  .full { margin-top:8px; font-size:14px; }
  .full summary { cursor:pointer; color:var(--accent); font-weight:600; list-style:none; user-select:none; }
  .full summary::-webkit-details-marker { display:none; }
  .full summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .full[open] summary::after { transform:rotate(180deg); }
  .full .body { margin-top:8px; padding:10px 12px; background:var(--card); border:2px solid var(--line); border-radius:10px; color:var(--ink); line-height:1.55; animation:slide .25s ease-out; }
  .full .body p { margin:0 0 8px; } .full .body p:last-child { margin:0; }
  .picker { position:absolute; display:flex; gap:4px; padding:5px; background:var(--pop); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); transform:translate(-50%, -100%); z-index:10; animation:pop .15s ease-out; }
  .picker::after { content:""; position:absolute; left:50%; bottom:-5px; width:10px; height:10px; background:var(--pop); transform:translateX(-50%) rotate(45deg); }
  .picker button { width:36px; height:36px; border:none; border-radius:8px; background:#202f36; color:var(--ink); font:inherit; font-size:20px; font-weight:700; cursor:pointer; position:relative; z-index:1; }
  .picker button:hover { background:var(--accent); }
  .picker button.cur { background:#2b3d45; box-shadow:inset 0 0 0 2px var(--sky); }
  @keyframes pop { from { opacity:0; transform:translate(-50%, -85%) scale(.92); } }
  .full .body .src { font-size:12px; color:var(--muted); margin-bottom:8px; }
  @keyframes slide { from { opacity:0; transform:translateY(-8px); } }
</style>

<body>
<main>
  <div class="top">
    <a class="back" href="app.html">← Visos temos</a>
    <a class="mode" id="modeLink" href="klaidos.html#skyryba">Mano klaidos</a>
  </div>
  <h1 id="title">Skyrybos treniruoklis</h1>
  <p class="sub" id="sub">Spausk tarpą tarp žodžių, kad padėtum ženklą. Užvesk pelę ant tarpo – iššoks pasirinkimai (<b>∅ , – :</b>), arba spausk tarpą, kad ženklai keistųsi.</p>
  <div class="card">
    <div class="progress" id="progress"></div>
    <div class="sentence" id="sentence"></div>
    <div class="actions" id="actions">
      <button class="primary" id="check">Tikrinti</button>
      <button class="secondary" id="next">Kitas sakinys</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</main>
<script src="shell.js?v=20"></script>

<script src="data.js?v=2"></script>
<script src="skyryba-data.js?v=3"></script>
<script src="round.js?v=8"></script>
<script>
const MISTAKE_MODE = new URLSearchParams(location.search).has("klaidos");
if (MISTAKE_MODE) {
  document.getElementById("title").textContent = "Skyrybos klaidų treniruotė";
  document.getElementById("sub").textContent = "Sakiniai, kuriuose suklydai. Sudėk visus ženklus – atsakyk teisingai 2 kartus iš eilės ir klaida keliauja į pataisytas.";
  document.getElementById("modeLink").textContent = "Klaidų sąrašas";
}

const MARKS = ["", ",", "–", ":"];
// fixing = { i, keys, given } while redoing a round's mistakes (see round.js): only keys are gaps
let current = -1, sent = null, checked = false, fixing = null;

function load(i, fix = null) {
  current = i; fixing = fix;
  const view = !!fix && !fix.keys.length;   // already solved → just look at it
  checked = view;                           // so Enter goes on to the next one
  const el = document.getElementById("sentence");
  el.classList.toggle("fixing", !!fix && !view);
  el.classList.remove("done");
  document.getElementById("check").style.display = view ? "none" : "";
  sent = skParse(SK_SENTENCES[i]);
  el.innerHTML = sent.words.map((w, g) => {
    if (g >= sent.gaps.length) return esc(w);
    if (fix && !fix.keys.includes(g)) {
      const m = fix.given[g] ?? "", bad = fix.bad?.includes(g);
      // wrong spots in red: your wrong mark, or "_" where a mark was missing
      if (bad) return esc(w) + (m === "–" ? ` <span class="kept miss">–</span> ` : `<span class="kept miss">${esc(m || "_")}</span> `);
      return esc(w) + (m === "–" ? ` <span class="kept">–</span> ` : m ? `<span class="kept">${esc(m)}</span> ` : " ");
    }
    return `${esc(w)}<button class="gap" data-g="${g}" data-m=""></button>`;
  }).join("");
  document.getElementById("result").innerHTML = "";
  hidePicker();
  if (!matchMedia("(hover: none)").matches) document.querySelector(".sentence .gap")?.focus({ preventScroll: true });
}

function setMark(b, mark) {
  b.dataset.m = mark; b.textContent = mark;
  b.className = "gap" + (mark ? " set" : "");
}
document.getElementById("sentence").addEventListener("click", e => {
  const b = e.target.closest(".gap"); if (!b || checked) return;
  // On touch screens the tap opens the choices instead of cycling
  if (matchMedia("(hover: none)").matches) return showPicker(b);
  setMark(b, MARKS[(MARKS.indexOf(b.dataset.m) + 1) % MARKS.length]);
  if (pickFor === b) showPicker(b);
});

// Hover a gap → choices pop up above it
let picker = null, pickFor = null, openTimer = null, closeTimer = null;
function hidePicker() { clearTimeout(openTimer); clearTimeout(closeTimer); picker?.remove(); picker = pickFor = null; }
function showPicker(b) {
  hidePicker();
  pickFor = b;
  picker = document.createElement("div");
  picker.className = "picker";
  picker.innerHTML = MARKS.map(m => `<button data-mark="${m}" class="${m === b.dataset.m ? "cur" : ""}" title="${m ? m : "Be ženklo"}">${m || "∅"}</button>`).join("");
  document.body.appendChild(picker);
  const r = b.getBoundingClientRect(), half = picker.offsetWidth / 2;
  picker.style.left = (Math.min(Math.max(r.left + r.width / 2, half + 8), innerWidth - half - 8) + scrollX) + "px";
  picker.style.top = (r.top + scrollY - 10) + "px";
  picker.addEventListener("click", e => {
    const c = e.target.closest("button"); if (!c) return;
    setMark(b, c.dataset.mark);
    hidePicker();
  });
}
document.addEventListener("mouseover", e => {
  const gap = checked ? null : e.target.closest(".sentence .gap");
  if (gap && gap !== pickFor) { clearTimeout(openTimer); openTimer = setTimeout(() => showPicker(gap), 120); }
  if (!gap) clearTimeout(openTimer);
  if (!pickFor) return;
  clearTimeout(closeTimer);
  if (gap !== pickFor && !e.target.closest(".picker")) closeTimer = setTimeout(hidePicker, 300);
});
addEventListener("resize", hidePicker);
document.addEventListener("keydown", e => { if (e.key === "Escape") hidePicker(); });
arrowKeys(document.getElementById("sentence"), (b, dir) => {
  if (checked) return;
  setMark(b, MARKS[(MARKS.indexOf(b.dataset.m) + dir + MARKS.length) % MARKS.length]);
  if (pickFor === b) showPicker(b);
}, hidePicker);

// One try per sentence: wrong spots go red and the gaps lock.
// After checking you see each mistake and its fix; you redo the mistakes after the whole round.
function check() {
  hidePicker();
  if (checked || document.getElementById("actions").style.display === "none" || document.getElementById("check").style.display === "none") return;
  checked = true;
  // locked now: drop the fixing red so right gaps turn green
  document.getElementById("sentence").classList.add("done");
  document.getElementById("sentence").classList.remove("fixing");
  const wrong = [], correct = [];
  // Paired gaps (e.g. both sides of a priedėlis) must use the same mark
  const pairVals = {}, given = { ...fixing?.given }, seen = { ...fixing?.given };
  const addPair = (g, m) => { const p = sent.gaps[g].pair; if (p) (pairVals[p] = pairVals[p] || new Set()).add(m); };
  document.querySelectorAll(".sentence .gap").forEach(b => addPair(+b.dataset.g, b.dataset.m));
  if (fixing) sent.gaps.forEach((_, g) => { if (!fixing.keys.includes(g)) addPair(g, fixing.given[g] ?? ""); });
  document.querySelectorAll(".sentence .gap").forEach(b => {
    const g = +b.dataset.g, gap = sent.gaps[g], val = b.dataset.m;
    const ok = gap.ans.includes(val) && !(gap.pair && pairVals[gap.pair].size > 1);
    b.className = "gap " + (ok ? (val ? "ok" : "") : (val ? "bad" : "miss"));
    // Only remember gaps that matter: a mark was expected, or a wrong mark was added
    if (!gap.def || !ok || (current + ":" + g) in skLoadMistakes()) skRecord(current, g, ok, val);
    seen[g] = val;
    if (ok) given[g] = val;
    if (!ok) wrong.push({ g, gap, val });
    else if (!gap.def) correct.push({ g, gap, val });
  });
  document.getElementById("check").style.display = "none";
  const a = sent.words;
  // Your mistake → the right answer + rule, shown right after checking so you learn from it
  const mHtml = wrong.map(({ g, gap, val }) => {
    const right = gap.ans.map(x => skJoin(a[g], x, a[g + 1])).join("  arba  ");
    return mistakeRow(fixLine(skJoin(a[g], val, a[g + 1]), right), gap.rule, skFullRule(gap.cat));
  }).join("");
  // Points: marked places right minus extra marks. In the fix pass the whole sentence is scored again
  // and you win back only what that adds to the best score so far (score rides on the redo).
  const sentPts = sent.gaps.filter(x => !x.def).length;
  const scoreNow = Math.max(0, sentPts - wrong.filter(w => !w.gap.def).length - wrong.filter(w => w.gap.def).length);
  const pts = fixing ? fixing.keys.length : sentPts;
  const good = fixing ? Math.max(0, scoreNow - fixing.score) : scoreNow;
  const redo = wrong.length ? { i: current, keys: wrong.map(w => w.g), given, score: Math.max(fixing?.score ?? 0, scoreNow) } : null;
  const badKeys = [...(fixing?.bad || []).filter(g => !(g in given)), ...wrong.map(w => w.g)];
  let html = fixing
    ? `<div class="score">${wrong.length ? `Pataisyta ${pts - wrong.length} / ${pts}` : "Viskas pataisyta!"}</div>`
    : `<div class="score">${wrong.length ? `${wrong.length} ${wrong.length === 1 ? "klaida" : "klaidos"}` : "Viskas teisingai!"}</div>`;
  if (wrong.length && !fixing) html += `<div class="hint">Klaidas galėsi pataisyti, kai baigsi visus sakinius.</div>`;
  document.getElementById("result").innerHTML = html + mHtml;
  roundAdd(good, pts, mHtml, redo, { i: current, keys: [], given: seen, bad: [...new Set(badKeys)] });
  updateModeLink();
}

function updateModeLink() {
  if (MISTAKE_MODE) return;
  const n = Object.keys(skLoadMistakes()).length;
  document.getElementById("modeLink").textContent = n ? `Mano klaidos (${n})` : "Mano klaidos";
}

// Shuffled deck, never the same sentence twice in a row
let deck = [];
function pool() {
  if (!MISTAKE_MODE) return SK_SENTENCES.map((_, i) => i);
  return [...new Set(Object.keys(skLoadMistakes()).map(id => +id.split(":")[0]))];
}
// Next sentence for the round (null when there are none)
function pickNext() {
  if (MISTAKE_MODE) deck = deck.filter(i => pool().includes(i));
  if (!deck.length) {
    deck = pool();
    if (!deck.length) return null;
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const last = deck.length - 1;
    if (deck.length > 1 && deck[last] === current) [deck[last], deck[0]] = [deck[0], deck[last]];
  }
  return deck.pop();
}
function showNoMistakes() {
  document.getElementById("sentence").innerHTML = `<div class="empty">Klaidų neliko!<br>Paspręsk daugiau sakinių <a href="skyryba.html">įprastame režime</a>.</div>`;
  document.getElementById("actions").style.display = "none";
  document.getElementById("result").innerHTML = "";
  hidePicker();
}

document.getElementById("check").onclick = check;
document.getElementById("next").onclick = roundNext;
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.repeat) return;   // holding Enter must not check the next sentence empty
  if (e.target.closest(".gap") || !e.target.closest("button, a, summary")) { if (document.getElementById("actions").style.display === "none") return; e.preventDefault(); checked ? roundNext() : check(); }
});
updateModeLink();
roundStart(() => Math.min(ROUND_SIZE, pool().length), "skyryba.html?klaidos", pickNext, fix => load(fix.i, fix.keys ? fix : null), showNoMistakes);
roundGo(0);
</script>
