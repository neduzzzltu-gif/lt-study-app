<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mano klaidos</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --ok:#1f8a4c; --bad:#c62828; --accent:#2b4cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .back { display:inline-block; color:var(--muted); text-decoration:none; font-size:14px; margin-bottom:12px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:17px; margin:28px 0 12px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .btn { display:inline-block; font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; text-decoration:none; }
  .primary { background:var(--ink); color:#fff; }
  .ghost { background:none; color:var(--muted); font-size:14px; padding:8px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .cat { margin-bottom:14px; }
  .cat:last-child { margin-bottom:0; }
  .cat .row { display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px; }
  .cat .row span { color:var(--muted); }
  .bar { height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--bad); border-radius:999px; }
  .cat p { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.4; }
  .word { border-left:4px solid var(--bad); background:var(--card); padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; }
  .word .w { font-size:17px; }
  .word .w s { color:var(--bad); } .w s { text-decoration:none; } .w u { text-decoration-thickness:2px; text-underline-offset:3px; }
  .word .w b { color:var(--ok); }
  .word .w small { color:var(--muted); font-size:13px; margin-left:6px; }
  .word .r { color:#444; font-size:14px; margin-top:4px; }
  .word.fixed { border-left-color:var(--ok); }
  .word.fixed .w s { color:var(--muted); }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tab { font:inherit; font-size:15px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty { color:var(--muted); line-height:1.6; }
  .full { margin-top:8px; font-size:14px; }
  .full summary { cursor:pointer; color:var(--accent); font-weight:600; list-style:none; user-select:none; }
  .full summary::-webkit-details-marker { display:none; }
  .full summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .full[open] summary::after { transform:rotate(180deg); }
  .full .body { margin-top:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; color:#333; line-height:1.55; animation:slide .25s ease-out; }
  .full .body p { margin:0 0 8px; } .full .body p:last-child { margin:0; }
  .full .body .src { font-size:12px; color:var(--muted); margin-bottom:8px; }
  @keyframes slide { from { opacity:0; transform:translateY(-8px); } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%233a3399%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial%27 font-weight=%27bold%27 font-size=%2738%27 fill=%27%23fffdf9%27 text-anchor=%27middle%27%3E%C4%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main>
  <a class="back" href="index.html">← Visos temos</a>
  <h1>Mano klaidos</h1>
  <p class="sub">Čia kaupiasi vietos, kuriose suklydai. Atsakyk teisingai 2 kartus iš eilės – klaida keliauja į pataisytas.</p>
  <div id="content"></div>
</main>

<script src="data.js"></script>
<script src="skyryba-data.js"></script>
<script>
const plural = n => n % 10 === 1 && n % 100 !== 11 ? "klaida" : (n % 10 === 0 || (n % 100 > 10 && n % 100 < 20)) ? "klaidų" : "klaidos";

// Each topic turns its saved mistakes into the same item shape
const SECTIONS = {
  rasyba: {
    title: "Rašyba", gen: "rašybos", page: "rasyba.html",
    items(fixed) {
      const m = loadMistakes(fixed ? FIXED_KEY : MISTAKES_KEY), out = [];
      for (const id in m) {
        const [si, k] = id.split(":").map(Number), parts = parse(SENTENCES[si]), p = parts[k];
        out.push({
          wrong: m[id].wrong, fixed: m[id].fixed, cat: p.cat, catName: CATS[p.cat]?.name, catHint: CATS[p.cat]?.hint, rule: p.rule, full: fullRule(p.cat),
          right: p.word ? p.ans : wordAround(parts, k, p.ans.split("/")[0]),
          yours: p.word ? (m[id].last || "—") : wordAround(parts, k, m[id].last && m[id].last !== "—" ? m[id].last : "_")
        });
      }
      return out;
    },
    clear: () => saveMistakes({}),
    clearFixed: () => saveMistakes({}, FIXED_KEY)
  },
  skyryba: {
    title: "Skyryba", gen: "skyrybos", page: "skyryba.html",
    items(fixed) {
      const m = skLoadMistakes(fixed ? SK_FIXED_KEY : SK_KEY), out = [];
      for (const id in m) {
        const [si, g] = id.split(":").map(Number), s = skParse(SK_SENTENCES[si]), gap = s.gaps[g], a = s.words;
        out.push({
          wrong: m[id].wrong, fixed: m[id].fixed, cat: gap.cat, catName: SK_CATS[gap.cat]?.name, catHint: "", rule: gap.rule, full: skFullRule(gap.cat),
          right: gap.ans.map(x => skJoin(a[g], x, a[g + 1])).join("  arba  "),
          yours: skJoin(a[g], m[id].last || "", a[g + 1])
        });
      }
      return out;
    },
    clear: () => skSaveMistakes({}),
    clearFixed: () => skSaveMistakes({}, SK_FIXED_KEY)
  }
};

let tab = location.hash === "#skyryba" ? "skyryba" : "rasyba";

function render() {
  const sec = SECTIONS[tab], items = sec.items(), fixed = sec.items(true).sort((a, b) => b.fixed - a.fixed);
  const fixedHtml = !fixed.length ? "" : `
    <h2>Pataisytos klaidos (${fixed.length})</h2>
    ${fixed.map(it => `<div class="word fixed"><div class="w">${fixLine(it.yours, it.right)}<small>✓ buvo ×${it.wrong}</small></div><div class="r">${esc(it.rule)}</div>${it.full}</div>`).join("")}
    <button class="btn ghost" id="clearFixed">Išvalyti pataisytų klaidų sąrašą</button>`;
  const counts = Object.fromEntries(Object.entries(SECTIONS).map(([k, s]) => [k, s.items().length]));
  const tabs = `<div class="tabs">${Object.entries(SECTIONS).map(([k, s]) =>
    `<button class="tab ${k === tab ? "on" : ""}" data-t="${k}">${s.title}${counts[k] ? ` (${counts[k]})` : ""}</button>`).join("")}</div>`;
  const el = document.getElementById("content");
  if (!items.length) {
    el.innerHTML = tabs + `<div class="card empty">${fixed.length ? "Aktyvių klaidų nėra." : "Klaidų dar nėra."} 🎉<br>Spręsk sakinius <a href="${sec.page}">${sec.gen} treniruoklyje</a> – čia atsiras vietos, kuriose suklydai.</div>` + fixedHtml;
    bindClearFixed(sec);
    return;
  }

  // Weak spots: total wrong answers per rule type
  const byCat = {};
  items.forEach(it => { byCat[it.cat] = byCat[it.cat] || { n: 0, name: it.catName, hint: it.catHint }; byCat[it.cat].n += it.wrong; });
  const cats = Object.values(byCat).sort((a, b) => b.n - a.n), max = cats[0].n;
  items.sort((a, b) => b.wrong - a.wrong);

  el.innerHTML = tabs + `
    <a class="btn primary" href="${sec.page}?klaidos">Treniruoti klaidas (${items.length}) →</a>
    <h2>Silpniausios vietos</h2>
    <div class="card">${cats.map(c => `
      <div class="cat">
        <div class="row">${esc(c.name || "Kita")} <span>${c.n} ${plural(c.n)}</span></div>
        <div class="bar"><i style="width:${Math.round(c.n / max * 100)}%"></i></div>
        ${c.hint ? `<p>${esc(c.hint)}</p>` : ""}
      </div>`).join("")}
    </div>
    <h2>Vietos, kuriose klydai</h2>
    ${items.map(it => `<div class="word"><div class="w">${fixLine(it.yours, it.right)}<small>×${it.wrong}</small></div><div class="r">${esc(it.rule)}</div>${it.full}</div>`).join("")}
    <button class="btn ghost" id="clear">Išvalyti visas ${sec.gen} klaidas</button>` + fixedHtml;
  bindClearFixed(sec);

  document.getElementById("clear").onclick = () => {
    if (confirm("Tikrai išvalyti visas klaidas?")) { sec.clear(); render(); }
  };
}
function bindClearFixed(sec) {
  const b = document.getElementById("clearFixed");
  if (b) b.onclick = () => { if (confirm("Išvalyti pataisytų klaidų sąrašą?")) { sec.clearFixed(); render(); } };
}
document.getElementById("content").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  tab = b.dataset.t; history.replaceState(null, "", "#" + tab); render();
});
render();
</script>
<script src="hyphen.js"></script>
</body>
</html>
