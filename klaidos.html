<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mano klaidos</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --ok:#1f8a4c; --bad:#c62828; --accent:#2b4cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; }
  .back { display:inline-block; color:var(--muted); text-decoration:none; font-size:14px; margin-bottom:12px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:17px; margin:28px 0 12px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .btn { display:inline-block; font:inherit; font-size:16px; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; text-decoration:none; }
  .primary { background:var(--ink); color:#fff; }
  .ghost { background:none; color:var(--muted); font-size:14px; padding:8px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .cat { margin-bottom:14px; }
  .cat:last-child { margin-bottom:0; }
  .cat .row { display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px; }
  .cat .row span { color:var(--muted); }
  .bar { height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--bad); border-radius:999px; }
  .cat p { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.4; }
  .word { border-left:4px solid var(--bad); background:var(--card); padding:10px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; }
  .word .w { font-size:17px; }
  .word .w s { color:var(--bad); } .w s { text-decoration:none; } .w u { text-decoration-thickness:2px; text-underline-offset:3px; }
  .word .w b { color:var(--ok); }
  .word .w small { color:var(--muted); font-size:13px; margin-left:6px; }
  .word .r { color:#444; font-size:14px; margin-top:4px; }
  .word.fixed { border-left-color:var(--ok); }
  .word.fixed .w s { color:var(--muted); }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tab { font:inherit; font-size:15px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty { color:var(--muted); line-height:1.6; }
  .full { margin-top:8px; font-size:14px; }
  .full summary { cursor:pointer; color:var(--accent); font-weight:600; list-style:none; user-select:none; }
  .full summary::-webkit-details-marker { display:none; }
  .full summary::after { content:" ▾"; display:inline-block; transition:transform .2s; }
  .full[open] summary::after { transform:rotate(180deg); }
  .full .body { margin-top:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; color:#333; line-height:1.55; animation:slide .25s ease-out; }
  .full .body p { margin:0 0 8px; } .full .body p:last-child { margin:0; }
  .full .body .src { font-size:12px; color:var(--muted); margin-bottom:8px; }
  @keyframes slide { from { opacity:0; transform:translateY(-8px); } }
  /* two lists side by side: weak spots | most repeated mistakes */
  main { max-width:1160px; }
  /* both columns as tall as the taller one; arrows sit at the bottom of the mistakes list */
  .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; align-items:stretch; }
  .cols > div { display:flex; flex-direction:column; min-width:0; }
  .cols h2 { margin-top:28px; }
  .cols .card, .cols .list { flex:1; }
  /* all pages sit in the same spot, so the box is as tall as the tallest page and the arrows never jump */
  .pages { display:grid; grid-template-columns:minmax(0,1fr); }
  .pages > .pg { grid-area:1 / 1; }
  .pages > .pg:not(.on) { visibility:hidden; }
  /* weak spot = one line: name | bar | count */
  .cat-line { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 88px; align-items:center; gap:14px; padding:9px 0; font-size:15px; overflow-wrap:break-word; }
  .cat-line + .cat-line { border-top:1px solid var(--line); }
  /* weak spots: all in one list, rows spread evenly to fill the card */
  .cols .card { display:grid; grid-auto-rows:1fr; }
  .cols .card .bar { height:10px; }
  .cat-line .bar { margin:0; background:var(--accent-soft); }
  .cat-line .bar i { background:linear-gradient(90deg, #e58a92, var(--bad)); }
  .cat-line span { text-align:right; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pager { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; }
  .pager span { min-width:52px; text-align:center; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pager button { width:40px; height:40px; display:grid; place-items:center; padding:0; border:none; border-radius:50%; background:var(--accent-soft); color:var(--indigo); font:inherit; font-size:20px; line-height:1; cursor:pointer; transition:background .15s, transform .1s; }
  .pager button:hover:not(:disabled) { background:#d4ebf5; }
  .pager button:active:not(:disabled) { transform:scale(.92); }
  .pager button:disabled { opacity:.35; cursor:default; }
  /* compact so the whole mistakes area fits on one screen */
  #content > .tabs { display:inline-flex; vertical-align:middle; margin:0 12px 0 0; }
  #content > .btn.primary { vertical-align:middle; padding:10px 20px; font-size:15px; }
  .cols h2 { margin:22px 0 10px; }
  #content > .tabs + .card { margin-top:18px; }
  .cols .word { position:relative; padding:13px 18px; margin-bottom:8px; border-radius:16px; }
  .cols .word .w { font-size:15.5px; padding-right:150px; }
  .cols .word .r { font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cols .word .full { margin-top:0; }
  .cols .word .full summary { position:absolute; top:14px; right:18px; font-size:12.5px; }
  .cols .word .full[open] .body { margin-top:8px; }
  .cols .cat-line { padding:6px 0; }
  .cols .card { padding:16px 24px; }
  @media (max-width:1110px) { .cols { grid-template-columns:1fr; gap:0; } .cat-line { grid-template-columns:minmax(0,1fr) 56px 80px; gap:10px; font-size:14px; } .cols .card { grid-auto-rows:auto; } .cols .word .w { padding-right:0; } .cols .word .full summary { position:static; margin-top:4px; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23147fae%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial%27 font-weight=%27bold%27 font-size=%2738%27 fill=%27%23fffdf9%27 text-anchor=%27middle%27%3E%C4%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css?v=12">
</head>
<body>
<main>
  <a class="back" href="index.html">← Visos temos</a>
    <h1>Mano klaidos</h1>
  <p class="sub">Čia kaupiasi vietos, kuriose suklydai. Atsakyk teisingai 2 kartus iš eilės – klaida keliauja į pataisytas.</p>
  <div id="content"></div>
</main>
<script src="shell.js?v=10"></script>

<script src="data.js"></script>
<script src="skyryba-data.js"></script>
<script>
const plural = n => n % 10 === 1 && n % 100 !== 11 ? "klaida" : (n % 10 === 0 || (n % 100 > 10 && n % 100 < 20)) ? "klaidų" : "klaidos";

// Each topic turns its saved mistakes into the same item shape
const SECTIONS = {
  rasyba: {
    title: "Rašyba", gen: "rašybos", page: "rasyba.html",
    items(fixed) {
      const m = loadMistakes(fixed ? FIXED_KEY : MISTAKES_KEY), out = [];
      for (const id in m) {
        const [si, k] = id.split(":").map(Number), parts = parse(SENTENCES[si]), p = parts[k];
        out.push({
          wrong: m[id].wrong, fixed: m[id].fixed, cat: p.cat, catName: CATS[p.cat]?.name, catHint: CATS[p.cat]?.hint, rule: p.rule, full: fullRule(p.cat),
          right: p.word ? p.ans : wordAround(parts, k, p.ans.split("/")[0]),
          yours: p.word ? (m[id].last || "—") : wordAround(parts, k, m[id].last && m[id].last !== "—" ? m[id].last : "_")
        });
      }
      return out;
    },
    clear: () => saveMistakes({}),
    clearFixed: () => saveMistakes({}, FIXED_KEY)
  },
  skyryba: {
    title: "Skyryba", gen: "skyrybos", page: "skyryba.html",
    items(fixed) {
      const m = skLoadMistakes(fixed ? SK_FIXED_KEY : SK_KEY), out = [];
      for (const id in m) {
        const [si, g] = id.split(":").map(Number), s = skParse(SK_SENTENCES[si]), gap = s.gaps[g], a = s.words;
        out.push({
          wrong: m[id].wrong, fixed: m[id].fixed, cat: gap.cat, catName: SK_CATS[gap.cat]?.name, catHint: "", rule: gap.rule, full: skFullRule(gap.cat),
          right: gap.ans.map(x => skJoin(a[g], x, a[g + 1])).join("  arba  "),
          yours: skJoin(a[g], m[id].last || "", a[g + 1])
        });
      }
      return out;
    },
    clear: () => skSaveMistakes({}),
    clearFixed: () => skSaveMistakes({}, SK_FIXED_KEY)
  }
};

let tab = location.hash === "#skyryba" ? "skyryba" : "rasyba";
// Mistakes list shows 8 per page, arrows move between pages
const STEP = 8;
let page = { items: 0 };
// Every page is rendered, only the current one is visible
function pages(list, arr, one) {
  const n = Math.max(Math.ceil(arr.length / STEP), 1);
  page[list] = Math.min(page[list], n - 1);
  return `<div class="pages" data-list="${list}">` + Array.from({ length: n }, (_, i) =>
    `<div class="pg${i === page[list] ? " on" : ""}">${arr.slice(i * STEP, (i + 1) * STEP).map(one).join("")}</div>`).join("") + `</div>`;
}
function pager(list, total) {
  const n = Math.ceil(total / STEP);
  if (n < 2) return "";
  return `<div class="pager" data-list="${list}"><button data-pg="${list}" data-d="-1" aria-label="Ankstesnis puslapis">‹</button>` +
    `<span></span><button data-pg="${list}" data-d="1" aria-label="Kitas puslapis">›</button></div>`;
}
// Show the current page and update "1 / 3" and the arrows, without re-rendering
function showPage(list) {
  const box = document.querySelector(`.pages[data-list="${list}"]`), pg = document.querySelector(`.pager[data-list="${list}"]`);
  if (!box) return;
  const all = box.children, p = page[list];
  [...all].forEach((d, i) => d.classList.toggle("on", i === p));
  if (!pg) return;
  pg.querySelector("span").textContent = `${p + 1} / ${all.length}`;
  pg.querySelector('[data-d="-1"]').disabled = p === 0;
  pg.querySelector('[data-d="1"]').disabled = p === all.length - 1;
}

function render() {
  const sec = SECTIONS[tab], items = sec.items(), fixed = sec.items(true).sort((a, b) => b.fixed - a.fixed);
  const fixedHtml = !fixed.length ? "" : `
    <h2>Pataisytos klaidos (${fixed.length})</h2>
    ${fixed.map(it => `<div class="word fixed"><div class="w">${fixLine(it.yours, it.right)}<small>buvo suklysta ${it.wrong} k.</small></div><div class="r">${esc(it.rule)}</div>${it.full}</div>`).join("")}
    <button class="btn ghost" id="clearFixed">Išvalyti pataisytų klaidų sąrašą</button>`;
  const counts = Object.fromEntries(Object.entries(SECTIONS).map(([k, s]) => [k, s.items().length]));
  const tabs = `<div class="tabs">${Object.entries(SECTIONS).map(([k, s]) =>
    `<button class="tab ${k === tab ? "on" : ""}" data-t="${k}">${s.title}${counts[k] ? ` (${counts[k]})` : ""}</button>`).join("")}</div>`;
  const el = document.getElementById("content");
  if (!items.length) {
    el.innerHTML = tabs + `<div class="card empty">${fixed.length ? "Aktyvių klaidų nėra." : "Klaidų dar nėra."}<br>Spręsk sakinius <a href="${sec.page}">${sec.gen} treniruoklyje</a> – čia atsiras vietos, kuriose suklydai.</div>` + fixedHtml;
    bindClearFixed(sec);
    return;
  }

  // Weak spots: total wrong answers per rule type
  const byCat = {};
  items.forEach(it => { byCat[it.cat] = byCat[it.cat] || { n: 0, name: it.catName }; byCat[it.cat].n += it.wrong; });
  const cats = Object.values(byCat).sort((a, b) => b.n - a.n), max = cats[0].n;
  items.sort((a, b) => b.wrong - a.wrong);

  el.innerHTML = tabs + `
    <a class="btn primary" href="${sec.page}?klaidos">Treniruoti klaidas (${items.length})</a>
    <div class="cols"><div>
    <h2>Silpniausios vietos</h2>
    <div class="card">${cats.map(c => `
      <div class="cat-line">${esc(c.name || "Kita")}<div class="bar"><i style="width:${Math.round(c.n / max * 100)}%"></i></div><span>${c.n} ${plural(c.n)}</span></div>`).join("")}
    </div>
    </div><div>
    <h2>Dažniausiai pasikartojančios klaidos</h2>
    <div class="list">${pages("items", items, it => `<div class="word"><div class="w">${fixLine(it.yours, it.right)}<small>×${it.wrong}</small></div><div class="r" title="${esc(it.rule)}">${esc(it.rule)}</div>${it.full}</div>`)}</div>
    ${pager("items", items.length)}
    </div></div>
    <button class="btn ghost" id="clear">Išvalyti visas ${sec.gen} klaidas</button>` + fixedHtml;
  bindClearFixed(sec);
  showPage("items");

  document.getElementById("clear").onclick = () => {
    if (confirm("Tikrai išvalyti visas klaidas?")) { sec.clear(); page = { items: 0 }; render(); }
  };
}
function bindClearFixed(sec) {
  const b = document.getElementById("clearFixed");
  if (b) b.onclick = () => { if (confirm("Išvalyti pataisytų klaidų sąrašą?")) { sec.clearFixed(); render(); } };
}
document.getElementById("content").addEventListener("click", e => {
  const pg = e.target.closest("[data-pg]");
  if (pg) {
    const list = pg.dataset.pg, d = pg.dataset.d;
    page[list] += +d; showPage(list);
    // keep focus on the same arrow (or the other one if this end is reached)
    const again = document.querySelector(`[data-pg="${list}"][data-d="${d}"]`);
    (again?.disabled ? document.querySelector(`[data-pg="${list}"][data-d="${-d}"]`) : again)?.focus();
    return;
  }
  const b = e.target.closest(".tab"); if (!b) return;
  tab = b.dataset.t; page = { items: 0 }; history.replaceState(null, "", "#" + tab); render();
});
render();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script defer src="auth-config.js"></script><script defer src="auth.js"></script>
<script src="hyphen.js?v=2"></script>
<script src="dev.js"></script>
<script src="motion.js?v=9"></script>
</body>
</html>
