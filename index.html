<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lietuvių kalbos treniruoklis</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8; --accent:#2b4cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .topic { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; text-decoration:none; color:inherit; transition:transform .15s ease, border-color .15s ease; }
  a.topic:hover { transform:translateY(-2px); border-color:var(--accent); }
  .topic .icon { font-size:28px; }
  .topic h2 { font-size:18px; margin:10px 0 4px; }
  .topic p { color:var(--muted); font-size:14px; margin:0; line-height:1.4; }
  .topic.soon { opacity:.5; cursor:default; }
  .tag { display:inline-block; margin-top:10px; font-size:12px; padding:3px 8px; border-radius:999px; background:var(--line); color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Lietuvių kalbos treniruoklis</h1>
  <p class="sub">Pasirink, ką nori mokytis.</p>
  <div class="grid" id="grid"></div>
</main>

<script src="data.js"></script>
<script>
// Add new topics here. Leave href empty to show it as "Netrukus".
const TOPICS = [
  { icon: "✍️", title: "Rašyba", desc: "Įrašyk praleistas raides ir parašyk žodžius kartu arba skyrium.", href: "rasyba.html" },
  { icon: "🎯", title: "Mano klaidos", desc: "Silpniausios vietos ir treniruotė tik su klaidomis.", href: "klaidos.html" },
  { icon: "❝", title: "Skyryba", desc: "Padėk trūkstamus skyrybos ženklus.", href: "" }
];

// Show how many mistakes are waiting
try {
  const n = Object.keys(loadMistakes()).length;
  if (n) TOPICS.find(t => t.href === "klaidos.html").desc = `${n} ${n % 10 === 1 && n % 100 !== 11 ? "klaida laukia" : (n % 10 === 0 || (n % 100 > 10 && n % 100 < 20)) ? "klaidų laukia" : "klaidos laukia"} pataisymo.`;
} catch {}

document.getElementById("grid").innerHTML = TOPICS.map(t => t.href
  ? `<a class="topic" href="${t.href}"><div class="icon">${t.icon}</div><h2>${t.title}</h2><p>${t.desc}</p></a>`
  : `<div class="topic soon"><div class="icon">${t.icon}</div><h2>${t.title}</h2><p>${t.desc}</p><span class="tag">Netrukus</span></div>`
).join("");
</script>
</body>
</html>
